name: 每日自动更新

on:
  schedule:
    # 北京时间 15:15（UTC 07:15），周一至周五（A股收盘后）
    - cron: '15 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 更新主力资金五路口径 + 注入盯盘页
        run: python reports/主力资金监控.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: 每日主力资金更新 $(date +%F)"
            git push
          fi
